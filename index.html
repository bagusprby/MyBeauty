<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F5">
    <meta name="description" content="My Glow Up Era — ruang pribadi untuk perjalananmu.">
    <title>My Glow Up Era</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
      *, *::before, *::after { box-sizing: inherit; }
      html { scroll-padding-top: env(safe-area-inset-top, 0px); }
      body { margin: 0; padding: 0; font: 15px/1.5 var(--font-body, Inter, sans-serif); background: var(--bg, #FAF7F5); color: var(--ink, #2B2426); }
      img { max-width: 100%; }
      [hidden]:not([hidden=until-found i]) { display: none !important; }
      #app-splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px)); background: #FAF7F5; color: #2B2426; transition: opacity .24s ease, visibility .24s ease; }
      #app-splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      @media (prefers-color-scheme: dark) { #app-splash { background: #1b1719; color: #f7f0ef; } }
      @media (prefers-reduced-motion: reduce) { #app-splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Menyiapkan My Glow Up Era">
      <div class="splash-content">
        <span class="splash-heart" aria-hidden="true">♡</span>
        <p class="splash-crest">My Glow Up Era</p>
        <span class="splash-loader" aria-hidden="true"></span>
        <span class="splash-caption">Menyiapkan ruangmu…</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Navigasi utama"></nav>
    <div class="wrap">
      <main id="main"></main>
    </div>
    <aside id="quiet-rail" aria-label="Ringkasan perjalanan"></aside>

    <dialog id="dlg">
      <h3 id="dT"></h3>
      <p id="dB"></p>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="dNo">Batal</button>
        <button class="btn" id="dYes">Ya</button>
      </div>
    </dialog>
    <dialog id="sheet"></dialog>
    <input type="file" accept="image/*" id="museInput" hidden onchange="setMusePhoto(this)">
    <input type="file" accept="image/*" id="vanityPhIn" hidden onchange="handleVanityPhoto(this)">
    <input type="file" accept="image/*" id="lookPhIn" hidden onchange="handleLookPhoto(this)">
    <input type="file" accept=".json,application/json" id="restoreIn" hidden onchange="handleRestoreFile(this)">
    <div id="toast"></div>

    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
